[project]
name = "lunazen-landing-site-navigator"
version = "0.1.0"
description = "Lunar Landing Site Navigator: terrain-aware Sun and Earth visibility for lunar sites"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "rasterio>=1.5.1",
    "spiceypy>=8.2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "playwright>=1.64.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lunazen"]
